name: Build Arch repo (Marketplace action)

on:
  push:
    branches: [master]
    paths:
      - '**/PKGBUILD'

jobs:
  build-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed for the final push to the www branch

    steps:
      # -------------------------------------------------
      # 1️⃣ Checkout the repository (including submodules if any)
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      # -------------------------------------------------
      # 2️⃣ Build every PKGBUILD with the Marketplace action
      # -------------------------------------------------
      - name: Build Arch packages
        uses: devops-infra/action-arch-pkgbuild@v1
        with:
          # The action automatically:
          #   • installs pacman, base-devel, gnupg, fakeroot
          #   • runs pacman-key --init && pacman-key --populate archlinux
          #   • runs makepkg -sf --noconfirm for each PKGBUILD it finds
          #   • copies the resulting *.pkg.tar.* files to ${{ runner.temp }}/arch-packages
          output-dir: ${{ runner.temp }}/arch-packages   # <‑‑ where the .pkg files will be placed
          extra-packages: sed gawk   # space‑separated list

      # -------------------------------------------------
      # 3️⃣ Verify that packages were produced (optional but helpful)
      # -------------------------------------------------
      - name: List built packages
        run: |
          echo "=== Packages built ==="
          ls -l "${{ runner.temp }}/arch-packages"
          if [ ! -e "${{ runner.temp }}/arch-packages"/*.pkg.tar.* ]; then
            echo "❌ No packages were built – aborting."
            exit 1
          fi

      # -------------------------------------------------
      # 4️⃣ Create the Arch repo database
      # -------------------------------------------------
      - name: Generate repo metadata
        env:
          REPO_DIR: ${{ runner.temp }}/repo
          REPO_NAME: BAR
        run: |
          mkdir -p "$REPO_DIR"
          cp "${{ runner.temp }}/arch-packages"/*.pkg.tar.* "$REPO_DIR"/
          cd "$REPO_DIR"
          repo-add "${REPO_NAME}.db.tar.gz" *.pkg.tar.*

      # -------------------------------------------------
      # 5️⃣ Push the repo to the www (GitHub Pages) branch
      # -------------------------------------------------
      - name: Push repo to www branch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git fetch origin www || true
          git checkout -B www
          rm -rf repo
          mkdir -p repo
          cp -r "${{ runner.temp }}/repo/"* repo/
          git add repo
          git commit -m "Update Arch repo (auto) [skip ci]" || echo "No changes"
          git push origin www
