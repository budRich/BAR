name: Build Arch repo

on:
  push:
    branches: [master]
    paths:
      - '**/PKGBUILD'   # trigger only when a PKGBUILD changes

jobs:
  build-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push to www branch

    steps:
      # -------------------------------------------------
      # 1️⃣ Checkout the repository (both branches)
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # fetch all history so we can push
          ref: master

      # -------------------------------------------------
      # 2️⃣ Install Arch tools (arch‑install‑scripts, base-devel, git, parallel)
      # -------------------------------------------------
      - name: Install Arch toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            arch-install-scripts \
            base-devel \
            git \
            parallel

      # -------------------------------------------------
      # 3️⃣ Build every package – parallel version
      # -------------------------------------------------
      - name: Build packages with parallel
        env:
          REPO_DIR: ${{ runner.temp }}/repo
        run: |
          mkdir -p "$REPO_DIR"

          # 1️⃣ List each unique directory that contains a PKGBUILD
          find . -type f -name PKGBUILD -printf '%h\n' | sort -u > pkgdirs.txt

          # 2️⃣ Helper script that will be called by parallel
          cat <<'EOF' > build_one.sh
          #!/usr/bin/env bash
          set -e
          PKGDIR="$1"
          REPO_TMP="/tmp/repo_tmp"

          echo "=== Building $PKGDIR ==="
          cd "$PKGDIR"
          # -sf : force rebuild, ignore existing .pkg files
          # --noconfirm : no interactive prompts
          makepkg -sf --noconfirm
          cp ./*.pkg.tar.* "$REPO_TMP"/
          EOF
          chmod +x build_one.sh

          # 3️⃣ Create a temporary folder that parallel can write into
          mkdir -p /tmp/repo_tmp

          # 4️⃣ Run GNU parallel – one job per CPU core
          parallel --jobs "$(nproc)" \
            ./build_one.sh {} :::: pkgdirs.txt

          # 5️⃣ Copy the built packages back to the runner’s temp folder
          cp /tmp/repo_tmp/*.pkg.tar.* "$REPO_DIR"/


      # -------------------------------------------------
      # 4️⃣ Create repo database files
      # -------------------------------------------------
      - name: Generate repo metadata
        env:
          REPO_DIR: ${{ runner.temp }}/repo
          REPO_NAME: BAR
        run: |
          sudo chroot /tmp/archroot /bin/bash -c "
            cd /workdir && \
            repo-add ${REPO_NAME}.db.tar.gz ${REPO_DIR}/*.pkg.tar.*
          "
          # Move the db files into the repo directory
          sudo cp "${REPO_DIR}/${REPO_NAME}.db.tar.gz" "$REPO_DIR/"
          sudo cp "${REPO_DIR}/${REPO_NAME}.files.tar.gz" "$REPO_DIR/"

      # -------------------------------------------------
      # 5️⃣ Commit & push to the www branch
      # -------------------------------------------------
      - name: Push repo to www branch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_NAME: BAR
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"

          # Switch to (or create) the www branch
          git checkout www || git checkout -b www

          # Clean old repo folder and copy the new one
          rm -rf repo
          mkdir -p repo
          cp -r "${{ runner.temp }}/repo/"* repo/

          # Add, commit, and push
          git add repo
          git commit -m "Update Arch repo (auto) [skip ci]" || echo "No changes to commit"
          git push origin www
