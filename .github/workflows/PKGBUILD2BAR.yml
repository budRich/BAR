name: Build Arch repo (Ubuntu runner + temporary Arch root)

on:
  push:
    branches: [master]
    paths:
      - '**/PKGBUILD'

jobs:
  build-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Install Ubuntu utilities
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y \
            arch-install-scripts \
            pacman \
            git \
            parallel \
            gnupg

      - name: Set up temporary Arch root
        env:
          ARCH_ROOT: /tmp/archroot
        run: |
          sudo mkdir -p "$ARCH_ROOT"
          sudo pacman -Sy --noconfirm --root "$ARCH_ROOT" pacman
          sudo pacman-key --init --root "$ARCH_ROOT"
          sudo pacman-key --populate archlinux --root "$ARCH_ROOT"
          sudo pacman -Sy --noconfirm --root "$ARCH_ROOT" archlinux-keyring base-devel

      - name: Build packages in parallel
        env:
          REPO_DIR: ${{ runner.temp }}/repo
          ARCH_ROOT: /tmp/archroot
        run: |
          mkdir -p "$REPO_DIR" /tmp/repo_tmp
          find . -type f -name PKGBUILD -printf '%h\n' | sort -u > pkgdirs.txt

          cat <<'EOF' > build_one.sh
          #!/usr/bin/env bash
          set -e
          PKGDIR="$1"
          ARCH_ROOT="/tmp/archroot"
          REPO_TMP="/tmp/repo_tmp"

          echo "=== Building $PKGDIR ==="
          cd "$PKGDIR"
          sudo pacman --root "$ARCH_ROOT" -Sy --noconfirm base-devel
          sudo pacman --root "$ARCH_ROOT" -C "$PKGDIR" -b "$PKGDIR" -c "$PKGDIR" -r "$ARCH_ROOT" \
            makepkg -sf --noconfirm
          cp ./*.pkg.tar.* "$REPO_TMP"/
          EOF
          chmod +x build_one.sh

          parallel --jobs "$(nproc)" ./build_one.sh {} :::: pkgdirs.txt
          cp /tmp/repo_tmp/*.pkg.tar.* "$REPO_DIR"/

      - name: Create repo database
        env:
          REPO_DIR: ${{ runner.temp }}/repo
          REPO_NAME: BAR
        run: |
          cd "$REPO_DIR"
          if compgen -G "*.pkg.tar.*" > /dev/null; then
            repo-add "${REPO_NAME}.db.tar.gz" *.pkg.tar.*
          else
            echo "No packages built – aborting."
            exit 1
          fi

      - name: Push repo to www branch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git fetch origin www || true
          git checkout -B www
          rm -rf repo
          mkdir -p repo
          cp -r "${{ runner.temp }}/repo/"* repo/
          git add repo
          git commit -m "Update Arch repo (auto) [skip ci]" || echo "No changes"
          git push origin www
