name: Build Arch repo (Ubuntu runner + Arch root)

on:
  push:
    branches: [master]
    paths:
      - '**/PKGBUILD'

jobs:
  build-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write               # needed to push to the www branch

    steps:
      # -------------------------------------------------
      # 1️⃣ Checkout repository (both branches)
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      # -------------------------------------------------
      # 2️⃣ Install host‑side tools (arch‑install‑scripts, git, parallel)
      # -------------------------------------------------
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            arch-install-scripts \
            git \
            parallel

      # -------------------------------------------------
      # 3️⃣ Create a temporary Arch root and install base-devel
      # -------------------------------------------------
      - name: Set up temporary Arch root
        env:
          ARCH_ROOT: /tmp/archroot
        run: |
          mkdir -p "$ARCH_ROOT"
          # Initialise pacman keyring (required for any pacman operation)
          sudo pacman-key --init
          sudo pacman-key --populate archlinux

          # Initialise pacman database inside the temporary root
          sudo pacman -Sy --noconfirm --root "$ARCH_ROOT" \
            pacman \
            archlinux-keyring

          # Install the full base-devel group into the temporary root
          sudo pacman -Sy --noconfirm --root "$ARCH_ROOT" \
            base-devel

          # Verify that makepkg is now available inside the root
          sudo pacman -Ql --root "$ARCH_ROOT" makepkg | head

      # -------------------------------------------------
      # 4️⃣ Build packages in parallel (using the temporary Arch root)
      # -------------------------------------------------
      - name: Build packages with parallel
        env:
          REPO_DIR: ${{ runner.temp }}/repo
          ARCH_ROOT: /tmp/archroot
        run: |
          mkdir -p "$REPO_DIR"

          # List each unique directory that contains a PKGBUILD
          find . -type f -name PKGBUILD -printf '%h\n' | sort -u > pkgdirs.txt

          # Helper script that will be executed inside the Arch root
          cat <<'EOF' > build_one.sh
          #!/usr/bin/env bash
          set -e
          PKGDIR="$1"
          REPO_TMP="/tmp/repo_tmp"

          echo "=== Building $PKGDIR ==="
          cd "$PKGDIR"

          # Run makepkg inside the temporary Arch root
          sudo pacman -r "$ARCH_ROOT" -S --noconfirm --needed base-devel
          sudo pacman -r "$ARCH_ROOT" -C "$PKGDIR" -b "$PKGDIR" -c "$PKGDIR" \
            -r "$ARCH_ROOT" \
            makepkg -sf --noconfirm

          cp ./*.pkg.tar.* "$REPO_TMP"/
          EOF
          chmod +x build_one.sh

          mkdir -p /tmp/repo_tmp

          # Run GNU parallel – one job per CPU core
          parallel --jobs "$(nproc)" \
            ./build_one.sh {} :::: pkgdirs.txt

          # Collect the built packages
          cp /tmp/repo_tmp/*.pkg.tar.* "$REPO_DIR"/

      # -------------------------------------------------
      # 5️⃣ Generate repo metadata (db & files)
      # -------------------------------------------------
      - name: Create repo database
        env:
          REPO_DIR: ${{ runner.temp }}/repo
          REPO_NAME: BAR
        run: |
          cd "$REPO_DIR"
          repo-add "${REPO_NAME}.db.tar.gz" *.pkg.tar.*
          # repo-add also creates ${REPO_NAME}.files.tar.gz

      # -------------------------------------------------
      # 6️⃣ Push the repo folder to the www branch
      # -------------------------------------------------
      - name: Push repo to www branch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"

          git checkout www || git checkout -b www

          rm -rf repo
          mkdir -p repo
          cp -r "${{ runner.temp }}/repo/"* repo/

          git add repo
          git commit -m "Update Arch repo (auto) [skip ci]" || echo "No changes"
          git push origin www
