name: Build Arch repo (Docker Arch root)

on:
  push:
    branches: [master]
    paths:
      - '**/PKGBUILD'

jobs:
  build-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Pull Arch Linux Docker image
        run: docker pull archlinux:latest

      - name: Build PKGBUILDs in Arch container
        env:
          REPO_DIR: ${{ runner.temp }}/repo
        run: |
          mkdir -p "$REPO_DIR"

          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            -v "$REPO_DIR:/repo" \
            -w /src \
            archlinux:latest \
            bash -eux <<'EOS'
          # -------------------------------------------------
          # Install everything we need
          # -------------------------------------------------
          pacman -Sy --noconfirm base-devel git gnupg parallel fakeroot
          # Refresh PATH (pacman may have added /usr/bin)
          source /etc/profile

          # -------------------------------------------------
          # Initialise pacman keyring (required by makepkg)
          # -------------------------------------------------
          pacman-key --init
          pacman-key --populate archlinux

          # -------------------------------------------------
          # Find all directories that contain a PKGBUILD
          # -------------------------------------------------
          find . -type f -name PKGBUILD -printf '%h\n' | sort -u > /tmp/pkgdirs.txt
          echo "PKGBUILD directories found:"
          cat /tmp/pkgdirs.txt

          # -------------------------------------------------
          # Helper that builds a single package
          # -------------------------------------------------
          build_one() {
            local dir="$1"
            echo "=== Building $dir ==="
            cd "$dir"
            # makepkg will fail on any error; we let the script abort
            makepkg -sf --noconfirm
            cp ./*.pkg.tar.* /repo/
          }
          export -f build_one

          # -------------------------------------------------
          # Run builds in parallel – abort if any job fails
          # -------------------------------------------------
          parallel --halt now,fail=1 --jobs "$(nproc)" build_one ::: $(cat /tmp/pkgdirs.txt)

          # -------------------------------------------------
          # Show what was produced (debug)
          # -------------------------------------------------
          echo "=== Files copied to /repo ==="
          ls -l /repo
          EOS

      - name: Verify packages were built
        env:
          REPO_DIR: ${{ runner.temp }}/repo
        run: |
          echo "Listing contents of $REPO_DIR"
          ls -l "$REPO_DIR"
          if ! compgen -G "$REPO_DIR"/*.pkg.tar.* > /dev/null; then
            echo "❌ No packages were built – aborting."
            exit 1
          fi

      - name: Generate repo database
        env:
          REPO_DIR: ${{ runner.temp }}/repo
          REPO_NAME: BAR
        run: |
          cd "$REPO_DIR"
          repo-add "${REPO_NAME}.db.tar.gz" *.pkg.tar.*

      - name: Push repo to www branch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git fetch origin www || true
          git checkout -B www
          rm -rf repo
          mkdir -p repo
          cp -r "${{ runner.temp }}/repo/"* repo/
          git add repo
          git commit -m "Update Arch repo (auto) [skip ci]" || echo "No changes"
          git push origin www
