name: Build Arch repo

on:
  push:
    branches: [master]
    paths:
      - '**/PKGBUILD'

jobs:
  build-repo:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: write

    steps:
      - name: Setup Arch environment
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git github-cli

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build packages
        run: bash .github/scripts/build-packages.sh

      - name: Setup GPG for signing
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: 03932D58D15CB5F4E5799586E9C940B5E6BE4258
        run: bash .github/scripts/setup-gpg.sh

      - name: Generate repo metadata
        env:
          GPG_KEY_ID: 03932D58D15CB5F4E5799586E9C940B5E6BE4258
        run: bash .github/scripts/generate-repo.sh

      - name: Push repo to www branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/push-repo.sh
