name: Build Arch repo (Marketplace action)

on:
  push:
    branches: [master]
    paths:
      - '**/PKGBUILD'

jobs:
  build-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Build Arch packages
        uses: archlinux-pkgbuild/action@v1
        with:
          output-dir: ${{ runner.temp }}/arch-packages

      - name: List built packages
        run: |
          echo "=== Packages built ==="
          ls -l "${{ runner.temp }}/arch-packages"
          if [ ! -e "${{ runner.temp }}/arch-packages"/*.pkg.tar.* ]; then
            echo "❌ No packages were built – aborting."
            exit 1
          fi

      - name: Generate repo metadata
        env:
          REPO_DIR: ${{ runner.temp }}/repo
          REPO_NAME: BAR
        run: |
          mkdir -p "$REPO_DIR"
          cp "${{ runner.temp }}/arch-packages"/*.pkg.tar.* "$REPO_DIR"/
          cd "$REPO_DIR"
          repo-add "${REPO_NAME}.db.tar.gz" *.pkg.tar.*

      - name: Push repo to www branch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git fetch origin www || true
          git checkout -B www
          rm -rf repo
          mkdir -p repo
          cp -r "${{ runner.temp }}/repo/"* repo/
          git add repo
          git commit -m "Update Arch repo (auto) [skip ci]" || echo "No changes"
          git push origin www
