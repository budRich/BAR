name: Build Arch repo (Docker Arch root)

on:
  push:
    branches: [master]
    paths:
      - '**/PKGBUILD'

jobs:
  build-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # -------------------------------------------------
      # 1️⃣ Checkout the repository
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      # -------------------------------------------------
      # 2️⃣ Pull the Arch Linux image (cached automatically)
      # -------------------------------------------------
      - name: Pull Arch Linux Docker image
        run: docker pull archlinux:latest

      # -------------------------------------------------
      # 3️⃣ Build packages inside the container
      # -------------------------------------------------
      - name: Build PKGBUILDs in Arch container
        env:
          REPO_DIR: ${{ runner.temp }}/repo
        run: |
          mkdir -p "$REPO_DIR"

          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            -v "$REPO_DIR:/repo" \
            -w /src \
            archlinux:latest \
            bash -eux <<'EOS'
          # ---- install build tools -------------------------------------------------
          pacman -Sy --noconfirm base-devel git gnupg parallel

          # ---- initialise keyring --------------------------------------------------
          pacman-key --init
          pacman-key --populate archlinux

          # ---- locate PKGBUILD directories -----------------------------------------
          find . -type f -name PKGBUILD -printf '%h\n' | sort -u > /tmp/pkgdirs.txt

          # ---- helper that builds a single package ---------------------------------
          build_one() {
            local dir="$1"
            echo "=== Building $dir ==="
            cd "$dir"
            makepkg -sf --noconfirm
            cp ./*.pkg.tar.* /repo/
          }
          export -f build_one

          # ---- run builds in parallel -----------------------------------------------
          parallel --jobs "$(nproc)" build_one ::: $(cat /tmp/pkgdirs.txt)
          EOS

      # -------------------------------------------------
      # 4️⃣ Create repo metadata (db & files)
      # -------------------------------------------------
      - name: Generate repo database
        env:
          REPO_DIR: ${{ runner.temp }}/repo
          REPO_NAME: BAR
        run: |
          cd "$REPO_DIR"
          if compgen -G "*.pkg.tar.*" > /dev/null; then
            repo-add "${REPO_NAME}.db.tar.gz" *.pkg.tar.*
          else
            echo "No packages were built."
            exit 1
          fi

      # -------------------------------------------------
      # 5️⃣ Push the repo to the www branch (GitHub Pages)
      # -------------------------------------------------
      - name: Push repo to www branch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git fetch origin www || true
          git checkout -B www
          rm -rf repo
          mkdir -p repo
          cp -r "${{ runner.temp }}/repo/"* repo/
          git add repo
          git commit -m "Update Arch repo (auto) [skip ci]" || echo "No changes"
          git push origin www
