name: Build Arch repo

on:
  push:
    branches: [master]
    paths:
      - '**/PKGBUILD'

jobs:
  build-repo:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: write

    steps:
      - name: Setup Arch environment
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name:  Build packages
        run: |
          mkdir -p /tmp/arch-packages
          
          # Find all PKGBUILD files and build them
          find . -name PKGBUILD -type f | while read pkgbuild; do
            pkg_dir=$(dirname "$pkgbuild")
            echo "Building package in $pkg_dir"
            cd "$GITHUB_WORKSPACE/$pkg_dir"
            
            # Create a build user (can't build as root)
            useradd -m builduser
            chown -R builduser:builduser . 

            echo "builduser ALL=(ALL) NOPASSWD: /usr/bin/pacman" >> /etc/sudoers
            
            # Build the package
            sudo -u builduser makepkg -s --nodeps --noconfirm
            
            # Copy built packages
            cp *.pkg.tar.* /tmp/arch-packages/ || true
            
            cd "$GITHUB_WORKSPACE"
          done

      - name: List built packages
        run: |
          echo "=== Packages built ==="
          ls -lh /tmp/arch-packages
          if [ !  -e /tmp/arch-packages/*.pkg.tar.* ]; then
            echo "❌ No packages were built – aborting."
            exit 1
          fi

      - name: Setup GPG for signing
        run: |
          # Create GPG home directory with proper permissions
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          
          # Configure GPG for non-interactive use
          cat > ~/.gnupg/gpg.conf <<EOF
          no-tty
          batch
          yes
          pinentry-mode loopback
          EOF
          
          cat > ~/.gnupg/gpg-agent.conf <<EOF
          allow-loopback-pinentry
          max-cache-ttl 7200
          default-cache-ttl 7200
          EOF
          
          # Kill any existing agent
          gpgconf --kill gpg-agent || true
          
          # Import the private key
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          
          # Trust the key ultimately
          echo -e "5\ny\n" | gpg --command-fd 0 --expert --edit-key 48E97CE0936581E3 trust quit || true

      - name: Generate repo metadata
        run: |
          mkdir -p /tmp/repo
          cp /tmp/arch-packages/*.pkg.tar.* /tmp/repo/
          cd /tmp/repo
          
          # Sign each package
          for pkg in *.pkg.tar.*; do
            echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --batch --yes --passphrase-fd 0 \
              --pinentry-mode loopback --detach-sign --no-armor "$pkg"
          done
          
          # Create repo database with signing
          echo "${{ secrets.GPG_PASSPHRASE }}" | repo-add --sign --key 48E97CE0936581E3 \
            --verify BAR.db.tar.gz *.pkg.tar.*

      - name: Push repo to www branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git fetch origin www || git checkout --orphan www
          git checkout www || git checkout --orphan www
          rm -rf repo
          mkdir -p repo
          cp -r /tmp/repo/* repo/
          git add repo
          git commit -m "Update Arch repo (auto) [skip ci]" || echo "No changes"
          git push origin www
